name: Pet SVG Publication

on:
  schedule:
    # Hourly background simulation & publication sweep at minute 47 (offset from top of hour)
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      force_render:
        description: 'Force SVG re-generation and README update check'
        required: false
        type: boolean
        default: false

# Least privilege: explicitly restrict permissions
permissions:
  contents: write

# Concurrency group ensures only one publication job runs at a time per repository
concurrency:
  group: pet-runtime-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-pet:
    name: Generate & Publish Pet SVG
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The unified publish-pipeline orchestrates passive simulation (scripts/simulate-pet.ts),
      # SVG badge rendering (scripts/publish-pet.ts), state persistence (pet/state/pet.json),
      # ledger tracking, manifest validation, [skip ci] commits, and atomic fast-forward-only Git publication.
      - name: Run Safe Git Publication Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --experimental-strip-types scripts/publish-pipeline.ts --ref "${{ github.ref_name }}"
