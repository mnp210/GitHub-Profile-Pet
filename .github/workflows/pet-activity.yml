name: Pet Activity Progression

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  schedule:
    # Periodic reconciliation sweep every 30 minutes to catch any commits dropped by concurrency
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pet-runtime-${{ github.repository }}
  cancel-in-progress: false

jobs:
  progress-activity:
    name: Award Activity XP & Update State
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Guard: skip processing if triggered by bot actions or automation commits, but always run schedule/dispatch
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        github.actor != 'dependabot[bot]' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, 'pet: update state') &&
        !contains(github.event.head_commit.message, 'pet: record activity')
      )

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Configure Git User Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process GitHub Activity & Award XP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node --experimental-strip-types scripts/process-activity.ts --ref "${{ github.ref_name }}"
