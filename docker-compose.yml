services:
  postgres:
    image: postgres:16-alpine
    container_name: github_profile_pet_pg
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: github_profile_pet_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d github_profile_pet_test"]
      interval: 5s
      timeout: 5s
      retries: 5
